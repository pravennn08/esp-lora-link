name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check sketch files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check sketches and shared headers
        shell: python
        run: |
          from pathlib import Path

          headers = []
          for sketch in ("LoRaButtonNodeA", "LoRaButtonNodeB"):
              for filename in (f"{sketch}.ino", "LoRaButtonLink.h"):
                  path = Path(sketch) / filename
                  if not path.is_file() or not path.read_bytes().strip():
                      raise SystemExit(f"Missing or empty file: {path}")
              headers.append((Path(sketch) / "LoRaButtonLink.h").read_bytes())

          if headers[0] != headers[1]:
              raise SystemExit("The two LoRaButtonLink.h files must match.")

          print("Both sketches are present and shared headers match.")
